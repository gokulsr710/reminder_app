plugins { id "com.android.application" }
android {
    namespace "com.daybell.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.daybell.app"
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName "2.4"
    }
    // Signing details live in keystore.properties (not committed). Without it, release builds are unsigned.
    def ksFile = rootProject.file("keystore.properties")
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; if (ksFile.exists()) signingConfig signingConfigs.release }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
